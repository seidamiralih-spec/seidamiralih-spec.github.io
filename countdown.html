<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شمارش معکوس تولد داداش 💙</title>

    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            min-height: 100vh;
            color: white;
            background:
                radial-gradient(circle at top, #102d65 0%, transparent 45%),
                linear-gradient(135deg, #020817, #071a38, #020817);
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        nav {
            width: 100%;
            padding: 22px 15px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            background: rgba(0, 10, 30, 0.65);
            border-bottom: 1px solid rgba(0, 174, 255, 0.25);
        }

        nav a {
            color: #cceaff;
            text-decoration: none;
            font-size: 14px;
            padding: 9px 15px;
            border-radius: 25px;
            transition: 0.3s;
        }

        nav a:hover,
        nav a.active {
            color: white;
            background: #087cff;
            box-shadow: 0 0 15px #087cff;
        }

        .container {
            width: 92%;
            max-width: 850px;
            text-align: center;
            padding: 75px 15px 40px;
        }

        .emoji {
            font-size: 65px;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 0 15px #00aaff);
        }

        h1 {
            font-size: clamp(27px, 5vw, 42px);
            color: #ffffff;
            text-shadow: 0 0 15px #008cff, 0 0 35px #0066ff;
            margin-bottom: 15px;
        }

        .subtitle {
            color: #b7dfff;
            font-size: 17px;
            margin-bottom: 45px;
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            direction: rtl;
        }

        .box {
            padding: 25px 10px;
            border: 1px solid #168cff;
            border-radius: 18px;
            background: rgba(0, 100, 255, 0.10);
            box-shadow: 0 0 18px rgba(0, 140, 255, 0.25),
                        inset 0 0 15px rgba(0, 140, 255, 0.08);
            transition: 0.3s;
        }

        .box:hover {
            transform: translateY(-7px);
            box-shadow: 0 0 28px rgba(0, 150, 255, 0.55);
        }

        .number {
            display: block;
            font-size: clamp(30px, 6vw, 48px);
            font-weight: 800;
            color: #65caff;
            text-shadow: 0 0 15px #008cff;
            font-variant-numeric: tabular-nums;
        }

        .label {
            display: block;
            margin-top: 10px;
            color: #d0eaff;
            font-size: 15px;
        }

        .message {
            margin-top: 45px;
            color: #a9d8ff;
            line-height: 2.2;
            font-size: 16px;
        }

        .footer {
            margin-top: 35px;
            color: #5daeff;
            font-size: 13px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        @media (max-width: 550px) {
            .countdown {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .container {
                padding-top: 50px;
            }

            nav {
                gap: 5px;
            }

            nav a {
                font-size: 12px;
                padding: 8px 10px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html">خانه</a>
        <a href="timer.html">محاسبه سن</a>
        <a href="surprise.html">سورپرایز</a>
        <a href="gallery.html">گالری عکس‌ها</a>
        <a href="countdown.html" class="active">تولد بعدی</a>
    </nav>

    <main class="container">

        <div class="emoji">🎂</div>

        <h1>تا تولد بعدیت چقدر مونده؟</h1>

        <p class="subtitle">
            شمارش معکوس تا روز خاص تو 💙
        </p>

        <div class="countdown">

            <div class="box">
                <span class="number" id="days">00</span>
                <span class="label">روز</span>
            </div>

            <div class="box">
                <span class="number" id="hours">00</span>
                <span class="label">ساعت</span>
            </div>

            <div class="box">
                <span class="number" id="minutes">00</span>
                <span class="label">دقیقه</span>
            </div>

            <div class="box">
                <span class="number" id="seconds">00</span>
                <span class="label">ثانیه</span>
            </div>

        </div>

        <p class="message">
            امیدوارم تولد بعدیت پر از اتفاق‌های قشنگ،
            موفقیت‌های بزرگ و لحظه‌های به‌یادموندنی باشه.
            <br>
            پیشاپیش تولدت مبارک داداش! 💙
        </p>

        <div class="footer">
            ساخته شده با 💙 برای داداش جونم
        </div>

    </main>

    <script>
        function updateCountdown() {

            const now = new Date();

            // تاریخ تولد: ۳ نوامبر
            // ماه‌ها در جاوااسکریپت از صفر شروع می‌شوند.
            let target = new Date(
                now.getFullYear(),
                10,
                3,
                0, 0, 0
            );

            // اگر تولد امسال گذشته باشد،
            // تولد سال بعد را هدف می‌گیریم.
            if (now >= target) {
                target = new Date(
                    now.getFullYear() + 1,
                    10,
                    3,
                    0, 0, 0
                );
            }

            const difference = target - now;

            const days = Math.floor(
                difference / (1000 * 60 * 60 * 24)
            );

            const hours = Math.floor(
                (difference / (1000 * 60 * 60)) % 24
            );

            const minutes = Math.floor(
                (difference / (1000 * 60)) % 60
            );

            const seconds = Math.floor(
                (difference / 1000) % 60
            );

            document.getElementById("days").textContent = days;

            document.getElementById("hours").textContent =
                String(hours).padStart(2, "0");

            document.getElementById("minutes").textContent =
                String(minutes).padStart(2, "0");

            document.getElementById("seconds").textContent =
                String(seconds).padStart(2, "0");
        }

        updateCountdown();

        setInterval(updateCountdown, 1000);
    </script>

</body>
</html>
